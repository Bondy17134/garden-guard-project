services:
  garden-guard:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      - ${HOST_DETECTIONS_DIR:-./storage/images}:/detections
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
