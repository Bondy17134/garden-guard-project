services:
  garden-guard:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      # Training results remain on the Linux server and can be selected with
      # YOLO_MODEL in .env without putting model weights in Git.
      - ./runs:/app/runs:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
